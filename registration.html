<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration | GL Bajaj Book Store</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="site">
<!-- TOP: logo, college name, links -->
<div class="logo" title="Replace with your logo image">
  <img
    src="logo.jpeg"
    alt="GLBITM logo"
    onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';"
  >
  <div class="logo-fallback" style="display:none;">
    <span class="color-stripe stripe-gold"></span>
    <span class="color-stripe stripe-maroon"></span>
    <span class="color-stripe stripe-dark"></span>
  </div>
</div>

<div class="title"><h1>GL Bajaj Institute Of Technology And Management</h1></div>
<nav>
<a href="index.html">Home</a>
<a href="login.html">Login</a>
<a href="registration.html" class="active">Registration</a>
<a href="catalogue.html">Catalogue</a>
<a href="cart.html">Cart</a>
</nav>
<!-- LEFT: branch links -->
<aside>
<h3>Branches</h3>
<a href="catalogue.html?branch=CSE" data-branch="CSE">CSE</a>
<a href="catalogue.html?branch=ECE" data-branch="ECE">ECE</a>
<a href="catalogue.html?branch=EEE" data-branch="EEE">EEE</a>
<a href="catalogue.html?branch=CIVIL" data-branch="CIVIL">CIVIL</a>
</aside>
<!-- RIGHT: page content -->
<main>
<h2>Registration Form</h2>
<form class="box" id="regForm" novalidate>
<div id="msg"></div>
<label class="row">Name: <input type="text" id="name"></label>
<label class="row">Password: <input type="password" id="password"></label>
<label class="row">E-mail ID: <input type="email" id="email" placeholder="name@domain.com"></label>
<label class="row">Phone Number: <input type="tel" id="phone" maxlength="10"></label>
<div class="row" style="display:grid;grid-template-columns:150px 1fr;gap:8px">Sex:
<span class="inline"><label><input type="radio" name="sex" value="Male"> Male</label>
<label><input type="radio" name="sex" value="Female"> Female</label>
<label><input type="radio" name="sex" value="Other"> Other</label></span></div>
<div class="row" style="display:grid;grid-template-columns:150px 1fr;gap:8px">Date of Birth:
<span class="inline"><select id="day"></select><select id="month"></select><select id="year"></select></span></div>
<div class="row" style="display:grid;grid-template-columns:150px 1fr;gap:8px">Languages Known:
<span class="inline"><label><input type="checkbox" name="lang" value="English"> English</label>
<label><input type="checkbox" name="lang" value="Telugu"> Telugu</label>
<label><input type="checkbox" name="lang" value="Hindi"> Hindi</label>
<label><input type="checkbox" name="lang" value="Tamil"> Tamil</label></span></div>
<label class="row">Address: <textarea id="address" rows="4"></textarea></label>
<div class="inline"><input type="submit" value="Submit"><input type="reset" value="Reset"></div>
</form>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
